<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HDT Case 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: engineering calc sheet. Inputs column on the left, verdict + pavement section + IITPave-style table on the right. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#d6dbd8;
  --accent:#0f5f6e; --accent-soft:#e1eef0;
  --bit:#2b2f2e; --wmm:#8e928c; --gsb:#c9b58f; --sub:#8a6b4a;
  --fail:#b3261e; --fail-bg:#f6d6d3; --warn-bg:#fbefb3; --orange-bg:#fbdcb8; --green-bg:#d5eccb; --pink-bg:#f8dbe7;
  --tag-ink:#1d2321;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --panel:#1c2120; --ink:#e7ebe9; --muted:#9aa5a1; --line:#2f3735;
  --accent:#5fb7c6; --accent-soft:#1d3337;
  --bit:#0b0d0c; --wmm:#6d716c; --gsb:#9c8a66; --sub:#6e5439;
  --fail:#ff8a80; --fail-bg:#5a1e1a; --warn-bg:#5a4f17; --orange-bg:#5c3d1c; --green-bg:#24442a; --pink-bg:#4e2636;
  --tag-ink:#f1f3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --panel:#1c2120; --ink:#e7ebe9; --muted:#9aa5a1; --line:#2f3735;
  --accent:#5fb7c6; --accent-soft:#1d3337;
  --bit:#0b0d0c; --wmm:#6d716c; --gsb:#9c8a66; --sub:#6e5439;
  --fail:#ff8a80; --fail-bg:#5a1e1a; --warn-bg:#5a4f17; --orange-bg:#5c3d1c; --green-bg:#24442a; --pink-bg:#4e2636;
  --tag-ink:#f1f3f2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,34px);letter-spacing:-.01em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:68ch}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:3px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
h2{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;color:var(--muted)}
fieldset{border:0;margin:0 0 16px;padding:0}
fieldset:last-child{margin-bottom:0}
legend{font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px;padding:0}
.f{display:grid;grid-template-columns:minmax(0,1fr) 108px;align-items:center;gap:8px;padding:3px 0}
.f label{color:var(--ink);font-size:13px}
.f label small{color:var(--muted);font-size:11px;margin-left:4px}
input,select{font-family:var(--mono);font-size:13px;width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);text-align:right}
select{text-align:left}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.derived{font-family:var(--mono);font-size:13px;text-align:right;padding:5px 8px;color:var(--accent);background:var(--accent-soft);border-radius:3px}
.right{display:flex;flex-direction:column;gap:22px;min-width:0}
.verdict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.verdict{grid-template-columns:minmax(0,1fr)}}
.v{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.v .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.v .name{font-family:var(--display);font-weight:700;font-size:15px}
.v .where{color:var(--muted);font-size:12px}
.big{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar::after{content:"";position:absolute;left:83.333%;top:0;bottom:0;width:2px;background:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--tag-ink)}
.c-fail{background:var(--fail-bg)} .c-warn{background:var(--warn-bg)} .c-orange{background:var(--orange-bg)} .c-green{background:var(--green-bg)} .c-pink{background:var(--pink-bg)}
.cmp{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.cmp input{width:110px}
.cmp .d{font-family:var(--mono)}
.sectionrow{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:700px){.sectionrow{grid-template-columns:minmax(0,1fr)}}
svg text{font-family:var(--body)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:720px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--body);font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--ink)}
td.l,th.l{text-align:left}
tr.hit td{background:var(--accent-soft)}
td.crit{font-weight:600;color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:10px 0 0;max-width:80ch}
.status{font-size:12px;color:var(--muted);font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:var(--body);font-size:13px;font-weight:600;padding:6px 12px;border-radius:3px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button:hover{background:var(--accent-soft)}
button.primary{background:var(--accent);color:var(--panel)}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
.f input[type=text]{text-align:left;font-family:var(--body)}
.dock{display:none}
@media (max-width:900px){
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:8px;align-items:stretch;
    background:var(--panel);border-top:2px solid var(--ink);
    padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock a{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--tag-ink);flex:1;min-width:0;padding:4px 8px;border-radius:4px}
  .dock b{font-family:var(--mono);font-weight:500;font-size:15px}
  .dock small{font-size:11px}
  .dock button{flex:0 0 auto;padding:6px 10px}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.mlist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.mlist b{font-family:var(--mono);font-weight:500}
</style>
<style>
body{margin:0}
[hidden]{display:none!important}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockcard{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px;font-size:16px}
.lockcard h1{font-size:24px}
.lockcard p{margin:0;color:var(--muted)}
.step{display:flex;gap:10px;align-items:flex-start}
.step b.n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px}
.devid{font-family:var(--mono);font-size:18px;letter-spacing:.03em;background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:4px;user-select:all;word-break:break-all}
.lockcard textarea{width:100%;font-family:var(--mono);font-size:13px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.lockcard button,.lockcard a.btn{font-size:16px;padding:10px 16px;min-height:44px;border-radius:6px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.lockcard a.btn{background:#1f8a4c;color:#fff;font-weight:600;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:15px;color:var(--accent)!important;min-height:1em}
.msg.bad{color:var(--fail)!important}
.licline{font-size:12px;color:var(--muted);font-family:var(--mono);margin:0;padding:0 16px 24px}
@media (max-width:900px){.licline{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
</style>
</head><body>
<div id="lock" class="lock"><div class="lockcard">
  <div><h1>HDT Case 101</h1><p>Pavement analysis tool · locked to this phone</p></div>
  <p id="noJs">Loading… If this message stays, open this file in Chrome or Safari, not in a file viewer.</p>
  <div id="lockUI" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="step"><b class="n">1</b><div style="flex:1;min-width:0"><p style="margin-bottom:6px">Send this Device ID to the tool owner:</p>
      <div class="devid" id="devId">…</div>
      <div class="row" style="margin-top:8px"><a class="btn" id="wa" href="#">Send on WhatsApp</a><button type="button" id="copyDev">Copy</button></div></div></div>
    <div class="step"><b class="n">2</b><div style="flex:1;min-width:0"><p style="margin-bottom:6px">Paste the key you receive, then tap Unlock:</p>
      <textarea id="licKey" rows="4" placeholder="HDT1.…" autocomplete="off" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button type="button" id="activate" class="primary">Unlock</button></div></div></div>
    <p id="licMsg" class="msg" role="status"></p>
  </div>
</div></div>
<div id="app" hidden></div>
<p id="licline" class="licline" hidden></p>

    var payload;
    return crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(pub){
      return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64d(parts[2]),enc.encode(parts[1]));
    }).then(function(good){
      if(!good) throw {why:'This key was not made by the tool owner, or it was changed.'};
      payload=JSON.parse(dec.decode(b64d(parts[1])));
      if(payload.d!==dev) throw {why:'This key is for another phone ('+payload.d+'). Each key works on one phone only. Send your own Device ID to the owner.'};
      if(payload.e&&today()>payload.e) throw {why:'This key expired on '+payload.e+'. Ask the owner for a new key.'};
      var c=payload.c||[]; if(c.indexOf('*')<0&&c.indexOf(CASE)<0) throw {why:'This key does not cover Case '+CASE+'.'};
      var w=b64d(payload.w);
      return wrapKey(dev).then(function(wk){ return crypto.subtle.decrypt({name:'AES-GCM',iv:w.slice(0,12)},wk,w.slice(12)); });
    }).then(function(K){ return crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']); })
    .then(function(ck){ var b=b64d(BLOB); return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},ck,b.slice(12)); })
    .then(function(buf){ return {ok:true,payload:payload,app:JSON.parse(dec.decode(buf))}; })
    .catch(function(e){ return {ok:false,why:(e&&e.why)||BAD}; });
  }
  function mount(app,p){
    $('lock').hidden=true; $('app').hidden=false; $('app').innerHTML=app.html;
    var sc=document.createElement('script'); sc.textContent=app.js; document.body.appendChild(sc);
    var l=$('licline'); l.hidden=false; l.textContent='Licensed to '+(p.n||'user')+' · this phone only ('+p.d+') · valid until '+(p.e||'no end date');
  }
  deviceId().then(function(dev){
    $('devId').textContent=dev;
    $('wa').href='https://wa.me/?text='+encodeURIComponent('Please send me a key for HDT Case 101. My Device ID: '+dev);
    $('copyDev').addEventListener('click',function(){
      var done=function(){ msg('Device ID copied. Send it to the tool owner.'); };
      try{ navigator.clipboard.writeText(dev).then(done,function(){ msg('Press and hold the Device ID to copy it.'); }); }catch(e){ msg('Press and hold the Device ID to copy it.'); }
    });
    var saved=store('hdt.key.'+CASE);
    var first=saved?tryKey(saved,dev):Promise.resolve(null);
    first.then(function(r){
      if(r&&r.ok){ mount(r.app,r.payload); return; }
      show(); if(r) msg(r.why,true);
      $('activate').addEventListener('click',function(){
        var k=$('licKey').value; if(!k.trim()){ msg('Paste the key first.',true); return; }
        msg('Checking key…');
        tryKey(k,dev).then(function(r){
          if(!r.ok){ msg(r.why,true); return; }
          store('hdt.key.'+CASE,k.trim().replace(/\s+/g,''));
          mount(r.app,r.payload);
        });
      });
    });
  },function(){ show(); msg('This phone could not make a Device ID. Open the file in Chrome or Safari.',true); });
})();
